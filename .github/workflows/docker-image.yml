name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 0'

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Build the Docker image
      run: |
        echo "${{ secrets.DOCKERPW }}" | docker login -u "panmourovaty" --password-stdin
        docker image build -t panmourovaty/dockered-nginx:latest .
    - name: Extract DEB file
      run: |
        id=$(docker create panmourovaty/dockered-nginx:latest)
        docker cp $id:/nginx.deb ./nginx.deb
        docker rm $id
    - name: Upload DEB as artifact
      uses: actions/upload-artifact@v4
      with:
        name: nginx-custom
        path: nginx.deb
    - name: Push Docker image
      run: |
        docker push panmourovaty/dockered-nginx:latest
